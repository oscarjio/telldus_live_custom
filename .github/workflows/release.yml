name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync manifest version with release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          jq --arg v "$TAG" '.version = $v' \
            custom_components/telldus_live_custom/manifest.json \
            > custom_components/telldus_live_custom/manifest.json.tmp
          mv custom_components/telldus_live_custom/manifest.json.tmp \
             custom_components/telldus_live_custom/manifest.json

      - name: Zip integration
        run: |
          cd custom_components/telldus_live_custom
          zip -r ../../telldus_live_custom.zip . \
            -x "*/__pycache__/*" "*.pyc"

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: telldus_live_custom.zip
